name: Release Deepfield theme

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Tag must match the version in manifest.json
          manifest_version=$(grep '"version"' manifest.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          if [ "$TAG" != "$manifest_version" ]; then
            echo "::error::Tag ($TAG) does not match manifest.json version ($manifest_version)"
            exit 1
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "See CHANGELOG.md for details." \
            theme.css manifest.json
